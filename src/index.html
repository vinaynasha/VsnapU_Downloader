<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>VSnapU Downloader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>VSnapU Downloader</h1>

  <div id="idle-state">
    <p>Waiting for a download link from the VSnapU website...</p>
  </div>

  <div id="editor-session-area">
    <a href="#" id="editor-login-link">Are you a registered editor? Login</a>

    <form id="editor-login-form" hidden>
      <input type="tel" id="editor-mobile-input" placeholder="Mobile number" autocomplete="username" />
      <input type="password" id="editor-password-input" placeholder="Password" autocomplete="current-password" />
      <button type="submit" id="editor-login-submit">Login</button>
      <button type="button" id="editor-login-cancel">Cancel</button>
      <p id="editor-login-error" class="error" hidden></p>
    </form>

    <p id="editor-logged-in-state" hidden>
      Logged in as <span id="editor-name"></span> (<span id="editor-role"></span>)
      -- <a href="#" id="editor-logout-link">Log out</a>
    </p>
  </div>

  <div id="job-state" hidden>
    <h2 id="job-name"></h2>
    <p id="folder-name"></p>

    <div id="progress-summary">
      <p id="overall-progress-text">0%</p>
      <p id="file-count-text">0 of 0 files</p>
      <button id="retry-failed-button" hidden>Retry Failed Downloads</button>
    </div>
    <progress id="overall-progress-bar" max="100" value="0"></progress>

    <p id="error-message" class="error" hidden></p>
    <div id="queue-status" class="queue-status" hidden>
      <p id="queue-status-text"></p>
      <ol id="queue-list"></ol>
    </div>

    <ul id="file-list"></ul>
  </div>

  <script src="main.js"></script>
</body>
</html>
